[package]
name = "big-bad-bool-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["James Hunt"]
description = "A deterministic runtime for many verified big-bad-bool programs on one scope: prepare, admit, commit, with bounded mailboxes, logical timers, admission policies and a replayable trace."
repository = "https://github.com/jameshuntt/big-bad-bool-runtime"
documentation = "https://docs.rs/big-bad-bool-runtime"
readme = "README.md"
keywords = ["deterministic", "runtime", "state-machine", "replay", "bitpack"]
categories = ["concurrency", "simulation"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Bowl observers: runtime events and program step events published to an ob-serve-a-bowl
# runtime. Observers only. Needs Rust 1.88, the rust-version of ob-serve-a-bowl 0.2.3; without
# it the crate builds on 1.85.
bowl = ["dep:ob-serve-a-bowl", "big-bad-bool/program-bowl"]

[dependencies]
scope = "0.4.0"
big-bad-bool = { version = "0.1.2", features = ["program"] }
uuid_macros = "0.1.0"
ob-serve-a-bowl = { version = "0.2.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "runtime"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# REMOVE AT RELEASE: scope 0.4.0 is not on crates.io yet. Until it is, the version above
# resolves to the checkout beside this one (branch capacity-waiters). Delete this section
# before `cargo publish`; with it the package cannot be verified against crates.io.
[patch.crates-io]
scope = { path = "../scope" }
